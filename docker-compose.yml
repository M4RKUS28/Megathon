# Shared environment for the backend API and the Arq worker (same image/config).
x-backend-env: &backend-env
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  MINIO_HOST: ${MINIO_HOST}
  MINIO_PORT: ${MINIO_PORT}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}
  COURSES_BUCKET: ${COURSES_BUCKET}
  MINIO_PRESIGNED_EXPIRY: ${MINIO_PRESIGNED_EXPIRY}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
  KEYCLOAK_HOST: ${KEYCLOAK_HOST}
  KEYCLOAK_PORT: ${KEYCLOAK_PORT}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  SECRET_KEY: ${SECRET_KEY}
  LOG_LEVEL: ${LOG_LEVEL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  REDIS_URL: ${REDIS_URL}
  DEVIN_API_KEY: ${DEVIN_API_KEY}
  DEVIN_ORG_ID: ${DEVIN_ORG_ID}
  DEVIN_API_BASE_URL: ${DEVIN_API_BASE_URL}
  DEVIN_SNAPSHOT_ID: ${DEVIN_SNAPSHOT_ID}
  DEVIN_PLAYBOOK_ID: ${DEVIN_PLAYBOOK_ID}
  DEVIN_MAX_ACU_LIMIT: ${DEVIN_MAX_ACU_LIMIT}
  DEMO_COMPANY_SLUG: ${DEMO_COMPANY_SLUG}
  PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL}
  # Google Gemini (agentic pipeline + media generation)
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image-preview}
  GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
  GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
  # Cala MCP (company knowledge)
  CALA_API_KEY: ${CALA_API_KEY:-${CALA:-}}
  CALA_MCP_URL: ${CALA_MCP_URL:-}
  # PixVerse (image/video generation)
  PIXVERSE_API_KEY: ${PIXVERSE_API_KEY:-${PIX_VERSE:-}}
  PIXVERSE_API_BASE_URL: ${PIXVERSE_API_BASE_URL:-https://app-api.pixverse.ai}
  # Asset-pipeline provider selection + Devin code-gen toggle
  ASSET_IMAGE_PROVIDER: ${ASSET_IMAGE_PROVIDER:-auto}
  ASSET_VIDEO_PROVIDER: ${ASSET_VIDEO_PROVIDER:-auto}
  ASSET_AUDIO_PROVIDER: ${ASSET_AUDIO_PROVIDER:-auto}
  COURSE_BUILD_USE_DEVIN: ${COURSE_BUILD_USE_DEVIN:-false}

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init ────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/${MINIO_BUCKET};
        mc anonymous set none local/${MINIO_BUCKET};
        mc mb --ignore-existing local/${COURSES_BUCKET};
        mc anonymous set download local/${COURSES_BUCKET};
        exit 0;
      "
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      COURSES_BUCKET: ${COURSES_BUCKET}

  # ── Redis (queue broker for Arq) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${AUTH_DOMAIN}
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker (Arq queue consumer — Devin generation pipeline) ───────────────────
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    command: ["uv", "run", "arq", "src.services.queue.worker.WorkerSettings"]
    entrypoint: []
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  postgres_data:
  minio_data:
