<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <style>
      :root {
        --brand: __BRAND__;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f6f7fb;
        color: #111827;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .eyebrow {
        color: var(--brand);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        padding: 8px 12px;
        margin: 6px 0;
        background: #fff;
        cursor: pointer;
      }
      .callout {
        border-left: 4px solid var(--brand);
        background: rgba(81, 69, 229, 0.06);
        padding: 12px;
        border-radius: 10px;
      }
      button.nav {
        background: var(--brand);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 8px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <script id="data" type="application/json">
      __COURSE_DATA__
    </script>
    <script>
      const course = JSON.parse(document.getElementById("data").textContent);
      let i = 0;
      const passed = new Set();
      let am = {};
      const cur = {};
      function resolve(l) {
        return l ? am[l] || l : "";
      }
      function block(b) {
        if (b.type === "heading") return "<h3>" + (b.text || "") + "</h3>";
        if (b.type === "paragraph") return "<p>" + (b.text || "") + "</p>";
        if (b.type === "list")
          return "<ul>" + (b.items || []).map((x) => "<li>" + x + "</li>").join("") + "</ul>";
        if (b.type === "callout") return '<div class="callout">' + (b.text || "") + "</div>";
        if (b.type === "image" && resolve(b.asset))
          return '<img style="width:100%;border-radius:12px" src="' + resolve(b.asset) + '"/>';
        if (b.type === "dialogue")
          return ((b.data && b.data.turns) || [])
            .map((t) => "<p><b>" + t.speaker + ":</b> " + t.text + "</p>")
            .join("");
        return b.text ? "<p>" + b.text + "</p>" : "";
      }
      function render() {
        const c = course.chapters[i];
        const app = document.getElementById("app");
        if (!c) {
          app.innerHTML = '<div class="card">Course complete.</div>';
          return;
        }
        let h =
          '<div class="card"><div class="eyebrow">Chapter ' +
          (i + 1) +
          " of " +
          course.chapters.length +
          "</div><h1>" +
          c.title +
          "</h1>";
        (c.pages || []).forEach((p) => (p.blocks || []).forEach((b) => (h += block(b))));
        const pass_pct = (c.quiz && c.quiz.passing_pct) || 80;
        h += '</div><div class="card"><h3>Knowledge check (need ' + pass_pct + "%)</h3>";
        ((c.quiz && c.quiz.questions) || []).forEach((q, qi) => {
          h += "<p><b>" + q.question + "</b></p>";
          q.options.forEach((o, oi) => {
            h += '<button class="opt" onclick="ans(' + qi + "," + oi + ')">' + o + "</button>";
          });
        });
        h += '<div id="qr"></div><button class="nav" onclick="grade()">Submit</button> ';
        if (passed.has(i) && i < course.chapters.length - 1)
          h += '<button class="nav" onclick="next()">Next chapter</button>';
        h += "</div>";
        app.innerHTML = h;
      }
      function ans(q, o) {
        cur[q] = o;
      }
      function grade() {
        const c = course.chapters[i];
        const qs = (c.quiz && c.quiz.questions) || [];
        let ok = 0;
        qs.forEach((q, qi) => {
          if (cur[qi] === q.answerIndex) ok++;
        });
        const pct = qs.length ? Math.round((ok / qs.length) * 100) : 100;
        const pass = pct >= ((c.quiz && c.quiz.passing_pct) || 80);
        if (pass) passed.add(i);
        document.getElementById("qr").innerHTML =
          "<p>" + pct + "% — " + (pass ? "passed" : "try again") + "</p>";
        if (pass) render();
      }
      function next() {
        i++;
        for (const k in cur) delete cur[k];
        render();
      }
      fetch("./asset_map.json")
        .then((r) => (r.ok ? r.json() : {}))
        .then((m) => {
          am = m || {};
          render();
        })
        .catch(() => render());
    </script>
  </body>
</html>
