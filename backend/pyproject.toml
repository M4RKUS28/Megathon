[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-keycloak>=3.9.0",
    "python-jose[cryptography]>=3.3.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "langgraph>=1.0.0,<=1.2.4",
    "langchain-core>=1.3.2,<=1.4.4",
    "langchain-google-genai>=4.2.0,<=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
