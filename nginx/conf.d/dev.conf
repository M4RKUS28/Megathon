# Dev: everything on localhost:80, Keycloak on :8080 (separate port)

server {
    listen 80;
    server_name localhost;

    # Backend API — forward to FastAPI dev server (hot reload on :8000)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # MinIO presigned URL passthrough
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
    }

    # Frontend — proxy to Vite dev server (HMR websocket included)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
