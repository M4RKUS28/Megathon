name: ${COMPOSE_PROJECT_NAME:-megathon}

x-backend-env: &backend-env
  POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
  POSTGRES_PORT: "${POSTGRES_PORT:?POSTGRES_PORT is required}"
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  MINIO_HOST: ${MINIO_HOST:?MINIO_HOST is required}
  MINIO_PORT: "${MINIO_PORT:?MINIO_PORT is required}"
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
  COURSES_BUCKET: ${COURSES_BUCKET:?COURSES_BUCKET is required}
  MINIO_PRESIGNED_EXPIRY: "${MINIO_PRESIGNED_EXPIRY:?MINIO_PRESIGNED_EXPIRY is required}"
  MINIO_SECURE: "${MINIO_SECURE:-false}"
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
  KEYCLOAK_HOST: ${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}
  KEYCLOAK_PORT: "${KEYCLOAK_PORT:?KEYCLOAK_PORT is required}"
  KEYCLOAK_RELATIVE_PATH: ${KEYCLOAK_RELATIVE_PATH:-/auth}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID is required}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
  KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  DEVIN_API_KEY: ${DEVIN_API_KEY:-}
  DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
  DEVIN_API_BASE_URL: ${DEVIN_API_BASE_URL:-https://api.devin.ai/v3}
  DEVIN_SNAPSHOT_ID: ${DEVIN_SNAPSHOT_ID:-}
  DEVIN_PLAYBOOK_ID: ${DEVIN_PLAYBOOK_ID:-}
  DEVIN_MAX_ACU_LIMIT: "${DEVIN_MAX_ACU_LIMIT:-20}"
  DEMO_COMPANY_SLUG: ${DEMO_COMPANY_SLUG:-acme}
  PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:?PLATFORM_PUBLIC_URL is required}
  COURSE_APP_TEMPLATE: ${COURSE_APP_TEMPLATE:-/app/course_app_template}
  COURSE_BUILD_ENABLED: "${COURSE_BUILD_ENABLED:-true}"
  COURSE_BUILD_TIMEOUT: "${COURSE_BUILD_TIMEOUT:-600}"
  COURSE_BUILD_USE_DEVIN: "${COURSE_BUILD_USE_DEVIN:-false}"
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
  GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
  GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
  CALA_API_KEY: ${CALA_API_KEY:-}
  CALA_MCP_URL: ${CALA_MCP_URL:-}
  CALA_TIMEOUT: "${CALA_TIMEOUT:-30}"
  PIXVERSE_API_KEY: ${PIXVERSE_API_KEY:-}
  PIXVERSE_API_BASE_URL: ${PIXVERSE_API_BASE_URL:-https://app-api.pixverse.ai}
  PIXVERSE_TIMEOUT: "${PIXVERSE_TIMEOUT:-300}"
  ASSET_IMAGE_PROVIDER: ${ASSET_IMAGE_PROVIDER:-auto}
  ASSET_VIDEO_PROVIDER: ${ASSET_VIDEO_PROVIDER:-auto}
  ASSET_AUDIO_PROVIDER: ${ASSET_AUDIO_PROVIDER:-auto}

x-backend-build: &backend-build
  context: ${PROJECT_ROOT:-..}
  dockerfile: backend/Dockerfile
  target: production

x-frontend-build: &frontend-build
  context: ${PROJECT_ROOT:-..}/frontend
  target: production
  args:
    VITE_API_URL: ${VITE_API_URL:-/api/v1}
    VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-/auth}
    VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-app}
    VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-app-frontend}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KEYCLOAK_DB: ${KEYCLOAK_DB:?KEYCLOAK_DB is required}
    volumes:
      - ${PROJECT_ROOT:-..}/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-storage.rule=${TRAEFIK_STORAGE_RULE:-PathPrefix(`/storage`)}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-storage.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-storage.priority=${TRAEFIK_SYSTEM_PRIORITY:-100}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-storage.service=${COMPOSE_PROJECT_NAME:-megathon}-storage"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-storage.middlewares=${COMPOSE_PROJECT_NAME:-megathon}-storage-strip,${COMPOSE_PROJECT_NAME:-megathon}-storage-host"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-megathon}-storage-strip.stripprefix.prefixes=/storage"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-megathon}-storage-host.headers.customrequestheaders.Host=minio:9000"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-megathon}-storage.loadbalancer.server.port=9000"
    networks:
      - default
      - traefik

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required};
        mc mb --ignore-existing local/${MINIO_BUCKET:?MINIO_BUCKET is required};
        mc anonymous set none local/${MINIO_BUCKET:?MINIO_BUCKET is required};
        mc mb --ignore-existing local/${COURSES_BUCKET:?COURSES_BUCKET is required};
        mc anonymous set download local/${COURSES_BUCKET:?COURSES_BUCKET is required};
        exit 0;
      "
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      COURSES_BUCKET: ${COURSES_BUCKET:?COURSES_BUCKET is required}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:?KEYCLOAK_DB is required}
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:?PLATFORM_PUBLIC_URL is required}
    volumes:
      - ${PROJECT_ROOT:-..}/keycloak/realm-app.json:/opt/keycloak/data/import/realm-app.json:ro
      - ${PROJECT_ROOT:-..}/keycloak/themes/coursive:/opt/keycloak/themes/coursive:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'for endpoint in localhost:9000:/health/ready localhost:8080:/auth/health/ready localhost:8080:/health/ready; do host=$${endpoint%%:*}; rest=$${endpoint#*:}; port=$${rest%%:*}; path=$${rest#*:}; if exec 3<>/dev/tcp/$$host/$$port; then printf \"HEAD %s HTTP/1.0\\r\\n\\r\\n\" \"$$path\" >&3; if grep -q \" 200 \" <&3; then exit 0; fi; exec 3<&- 3>&-; fi; done; exit 1'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-auth.rule=${TRAEFIK_AUTH_RULE:-PathPrefix(`/auth`)}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-auth.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-auth.priority=${TRAEFIK_SYSTEM_PRIORITY:-100}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-auth.service=${COMPOSE_PROJECT_NAME:-megathon}-auth"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-megathon}-auth.loadbalancer.server.port=8080"
    networks:
      - default
      - traefik

  backend:
    image: ${BACKEND_IMAGE:-coursive-backend}:${IMAGE_TAG:-local}
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-api.rule=${TRAEFIK_API_RULE:-PathPrefix(`/api`)}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-api.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-api.priority=${TRAEFIK_SYSTEM_PRIORITY:-100}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-api.service=${COMPOSE_PROJECT_NAME:-megathon}-api"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}-api.middlewares=${COMPOSE_PROJECT_NAME:-megathon}-api-strip"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-megathon}-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-megathon}-api.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik

  worker:
    image: ${BACKEND_IMAGE:-coursive-backend}:${IMAGE_TAG:-local}
    build: *backend-build
    restart: unless-stopped
    command: ["uv", "run", "arq", "src.services.queue.worker.WorkerSettings"]
    entrypoint: []
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-coursive-frontend}:${IMAGE_TAG:-local}
    build: *frontend-build
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}.rule=${TRAEFIK_ROUTER_RULE:-PathPrefix(`/`)}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}.priority=${TRAEFIK_PRIORITY:-1}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-megathon}.service=${COMPOSE_PROJECT_NAME:-megathon}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-megathon}.loadbalancer.server.port=4173"
    networks:
      - default
      - traefik

volumes:
  postgres_data:
  minio_data:

networks:
  default:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
