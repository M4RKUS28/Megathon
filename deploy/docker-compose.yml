# Shared environment for the backend API and the Arq worker (same image/config).
x-backend-env: &backend-env
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  MINIO_HOST: ${MINIO_HOST}
  MINIO_PORT: ${MINIO_PORT}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}
  COURSES_BUCKET: ${COURSES_BUCKET:-courses}
  MINIO_PRESIGNED_EXPIRY: ${MINIO_PRESIGNED_EXPIRY}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
  KEYCLOAK_HOST: ${KEYCLOAK_HOST}
  KEYCLOAK_PORT: ${KEYCLOAK_PORT}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  SECRET_KEY: ${SECRET_KEY}
  LOG_LEVEL: ${LOG_LEVEL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  DEVIN_API_KEY: ${DEVIN_API_KEY:-}
  DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
  DEVIN_API_BASE_URL: ${DEVIN_API_BASE_URL:-https://api.devin.ai/v3}
  DEVIN_SNAPSHOT_ID: ${DEVIN_SNAPSHOT_ID:-}
  DEVIN_PLAYBOOK_ID: ${DEVIN_PLAYBOOK_ID:-}
  DEVIN_MAX_ACU_LIMIT: ${DEVIN_MAX_ACU_LIMIT:-20}
  DEMO_COMPANY_SLUG: ${DEMO_COMPANY_SLUG:-acme}
  PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:-http://localhost}
  COURSE_TEMPLATE_DIST: ${COURSE_TEMPLATE_DIST:-/app/course_template_dist}

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init ────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/${MINIO_BUCKET};
        mc anonymous set none local/${MINIO_BUCKET};
        mc mb --ignore-existing local/${COURSES_BUCKET:-courses};
        mc anonymous set download local/${COURSES_BUCKET:-courses};
        exit 0;
      "
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      COURSES_BUCKET: ${COURSES_BUCKET:-courses}

  # ── Redis (queue broker for Arq) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${DOMAIN}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:-http://localhost}
    volumes:
      - ./keycloak/realm-app.json:/opt/keycloak/data/import/realm-app.json:ro
      - ./keycloak/themes/coursive:/opt/keycloak/themes/coursive:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker (Arq queue consumer — Devin generation pipeline) ───────────────────
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    command: ["uv", "run", "arq", "src.services.queue.worker.WorkerSettings"]
    entrypoint: []
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-/auth}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-app}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-app-frontend}
    restart: unless-stopped

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      DOMAIN: ${DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|AUTH_DOMAIN)$"
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  postgres_data:
  minio_data:
