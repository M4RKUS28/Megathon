# Dev overrides — hot reload, exposed ports, debug mode
services:

  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI

  redis:
    ports:
      - "6379:6379"

  keycloak:
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HTTP_RELATIVE_PATH: /
      KC_PROXY: none
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-app.json:/opt/keycloak/data/import/realm-app.json:ro
      - ./keycloak/themes/coursive:/opt/keycloak/themes/coursive:ro
    ports:
      - "8080:8080"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/alembic:/app/alembic:rw
    environment:
      LOG_LEVEL: DEBUG
      RELOAD: "true"
      KEYCLOAK_RELATIVE_PATH: /
      # Bind-mounted source lives on the Windows host (Docker Desktop), where
      # inotify isn't available — watchfiles (uvicorn --reload) crashes with
      # "os error 22". Force polling so hot reload works on any filesystem.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: ["uv", "run", "arq", "src.services.queue.worker.WorkerSettings", "--watch", "src"]
    entrypoint: []
    volumes:
      - ./backend/src:/app/src:rw
    environment:
      LOG_LEVEL: DEBUG
      KEYCLOAK_RELATIVE_PATH: /
      # See backend service: inotify is unavailable on the Windows host mount,
      # so arq's --watch (watchfiles) needs polling to avoid "os error 22".
      WATCHFILES_FORCE_POLLING: "true"

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      # avoid overwriting node_modules inside container
      - /app/node_modules
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-app}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-app-frontend}

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/templates
    ports:
      - "80:80"

# Dev uses freshly-named volumes so first boot runs the Postgres init scripts
# (which create the Keycloak database). Bump the suffix to start clean again.
volumes:
  postgres_data:
    name: megathon_postgres_data_v2
  minio_data:
    name: megathon_minio_data_v2
